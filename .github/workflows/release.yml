name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Paketle (${{ matrix.asset }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            asset: linux-x64
          - os: windows-latest
            asset: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Kodu al
        uses: actions/checkout@v7.0.1
      - name: Node.js kur
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Bağımlılıkları kur
        run: npm ci
      - name: Linux paketini hazırla
        if: runner.os == 'Linux'
        shell: bash
        run: |
          npm prune --omit=dev
          mkdir -p release/gerit
          cp -R bin public scripts src views node_modules release/gerit/
          cp .env.example CHANGELOG.md LICENSE README.md README.en.md package.json package-lock.json release/gerit/
          chmod +x release/gerit/scripts/start.sh
          tar -czf "gerit-${GITHUB_REF_NAME}-linux-x64.tar.gz" -C release gerit
      - name: Windows kurulum paketini hazırla
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run desktop:dist
          Copy-Item release/desktop/Gerit-Setup-*.exe .
      - name: Paketi yükle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gerit-${{ matrix.asset }}
          path: |
            gerit-*
            Gerit-Setup-*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: GitHub yayını oluştur
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Paketleri indir
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Yayını oluştur
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes --title "Gerit ${GITHUB_REF_NAME}"
